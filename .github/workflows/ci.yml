name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust tests (tokeniser, parser, serialiser, FFI smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --verbose --workspace
      - name: cargo test --workspace
        run: cargo test --release --verbose --workspace --no-fail-fast

  c-smoke:
    name: C smoke test (compile + link libcjson.so)
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
      - name: Run C smoke test
        run: bash cjson-rs-ffi/tests/c/run-c-smoke.sh

  upstream-conformance:
    name: Upstream cJSON public-API tests (98% target)
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
      - name: Run upstream cJSON test runner
        run: bash conformance/run-upstream-tests.sh

  install-test:
    name: Drop-in install (pkg-config + CMake, soname, exported symbols)
    runs-on: ${{ matrix.os }}
    needs: rust-tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
      - name: Install pkg-config and CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config cmake
      - name: Install into a scratch prefix and build C against it
        run: sh cjson-rs-ffi/tests/c/run-install-test.sh
      - name: Check soname and exported symbols (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p cjson-rs-ffi
          lib=target/release/libcjson.so
          readelf -d "$lib" | grep 'SONAME.*libcjson\.so\.1'
          n=$(nm -D --defined-only "$lib" | grep -vc ' T cJSON_\| D cJSON_' || true)
          test "$n" = 0 || { nm -D --defined-only "$lib" | grep -v ' cJSON_'; exit 1; }
